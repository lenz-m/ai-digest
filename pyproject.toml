[project]
name = "ai-digest"
version = "0.1.0"
description = "Weekly AI-news digest: fetch, dedupe, rank, summarize, email, archive to Obsidian."
requires-python = ">=3.10"
dependencies = [
    "feedparser>=6.0",
    "trafilatura>=1.8",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
